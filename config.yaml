# ============================================================
# MITM Proxy — Game Launcher Configuration
# Domain: prag.digitain.tools
# ============================================================

proxy:
  host: "0.0.0.0"
  port: 8080         # plain-HTTP proxy port (clients use CONNECT for HTTPS)
  domain: "prag.digitain.tools"

  ssl:
    enabled: true

    # Path to the TLS certificate used for the proxy domain.
    # Leave null to use mitmproxy's auto-generated CA (see launch.sh).
    #
    # For a real cert (e.g. from Let's Encrypt):
    #   cert: "certs/prag.digitain.tools-fullchain.pem"
    #   key:  "certs/prag.digitain.tools.key"
    cert: null
    key: null

    # Do not verify TLS certificates of upstream servers.
    # Required when the upstream uses self-signed or expired certs.
    verify_upstream: false

# ============================================================
# Analytics blocking — return 204 No Content immediately
# ============================================================

analytics_block:
  domains:
    - "google-analytics.com"
    - "googletagmanager.com"
    - "analytics.google.com"
    - "firebase.io"
    - "firebaseio.com"
    - "firebaseapp.com"
    - "crashlytics.com"
    - "fabric.io"
    - "amplitude.com"
    - "api.amplitude.com"
    - "api2.amplitude.com"
    - "mixpanel.com"
    - "api.mixpanel.com"
    - "segment.com"
    - "api.segment.io"
    - "cdn.segment.com"
    - "sentry.io"
    - "ingest.sentry.io"
    - "datadog-hq.com"
    - "datadoghq.com"
    - "newrelic.com"
    - "collector.newrelic.com"
    - "bam.nr-data.net"
    - "stats.g.doubleclick.net"
    - "hotjar.com"
    - "fullstory.com"
    - "logrocket.com"

  path_patterns:
    - ".*/telemetry.*"
    - ".*/analytics.*"
    - ".*/tracking.*"
    - ".*/metrics.*"
    - ".*/events/track.*"
    - ".*/collect\\?.*"
    - ".*/__utm\\..*"
    - ".*/ping\\?.*"
    - ".*/heartbeat.*"

# ============================================================
# Static URL rewrites
# Applied AFTER ?host= routing, so `match` runs against the
# already-resolved upstream URL.
#
# Traffic is routed through prag.digitain.tools by default.
# ============================================================

url_rewrites:
  rules:
    # Game CDN / asset delivery
    - match: "https://cdn\\.game\\.example\\.com/(.*)"
      replace: "https://prag.digitain.tools/cdn/\\1"
      target_host: "prag.digitain.tools"

    # Launcher update manifest
    - match: "https://launcher\\.game\\.example\\.com/manifest\\.json"
      replace: "https://prag.digitain.tools/manifest.json"
      target_host: "prag.digitain.tools"

    # Authentication / login
    - match: "https://auth\\.game\\.example\\.com/(.*)"
      replace: "https://prag.digitain.tools/auth/\\1"
      target_host: "prag.digitain.tools"

    # Patch / update server
    - match: "https://patch\\.game\\.example\\.com/(.*)"
      replace: "https://prag.digitain.tools/patch/\\1"
      target_host: "prag.digitain.tools"

    # Versioned game API
    - match: "https://api\\.game\\.example\\.com/v([0-9]+)/(.*)"
      replace: "https://prag.digitain.tools/api/v\\1/\\2"
      target_host: "prag.digitain.tools"

# ============================================================
# Header scrubbing
# ============================================================

header_modifications:
  remove_request:
    - "X-Analytics-Id"
    - "X-Tracking-Id"
    - "X-Session-Id"
    - "X-Device-Id"
    - "X-Fingerprint"
  remove_response:
    - "X-Analytics-Token"

# ============================================================
# Game launch interception
# ============================================================

game_launch:
  capture_launch_token: true
  token_url_patterns:
    - ".*/launch.*"
    - ".*/session.*"
    - ".*/token.*"
  inject_headers: {}
    # Uncomment to force region or debug mode:
    # X-Game-Region: "EU"
    # X-Debug-Mode: "0"

# ============================================================
# WebSocket
# ============================================================

websocket:
  log_messages: false
  max_message_log_bytes: 256

# ============================================================
# Logging
# ============================================================

logging:
  level: "INFO"        # DEBUG | INFO | WARNING | ERROR
  log_file: "proxy.log"
  log_blocked: true
  log_rewrites: true
  log_headers: false
